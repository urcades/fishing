[package]
name = "fishing-protocol"
version = "0.1.0"
edition = "2021"
description = "Pure, bounded state machines and coupled dynamics for casual fishing minigames"
license = "MIT OR Apache-2.0"
repository = "https://github.com/urcades/fishing"
readme = "README.md"
keywords = ["fishing", "gamedev", "simulation", "state-machine", "deterministic"]
categories = ["game-development", "simulation"]
include = ["src/**", "tests/**", "spec/PROTOCOL.md", "README.md", "LICENSE-*"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[package.metadata.docs.rs]
all-features = true
